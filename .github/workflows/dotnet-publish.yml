name: Build and deploy data structure package

on:
  push:
    tags:
      - 'data-*'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build solution and run tests

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore dependencies
        run: dotnet restore
      - name: Build Debug
        run: dotnet build --no-restore -c Debug
      - name: Test Debug
        run: dotnet test --no-build --verbosity normal
      - name: Build Release
        run: dotnet build --no-restore -c Release
      - name: Test Release
        run: dotnet test --no-build -c Release --verbosity normal

  publish-nuget:
    runs-on: ubuntu-latest
    name: Build and publish NuGet package
    needs: build

    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET with NuGet
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: NuGet Login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Rebuild nuget package
        run: dotnet build WoWsShipBuilder.DataStructures -c Release
      - name: Publish nuget package
        run: dotnet nuget push "WoWsShipBuilder.DataStructures/bin/Release/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}